<ion-content class="login-content" [fullscreen]="true">
  <div class="page-container">

    <!-- Top Navigation Header with Logo -->
    <header class="top-nav">
      <div class="nav-logo">
        <div class="logo-orb-small">
          <div class="orb-dot dot-top"></div>
          <div class="orb-heart">
            <ion-icon name="heart"></ion-icon>
          </div>
          <div class="orb-dot dot-left"></div>
          <div class="orb-dot dot-right"></div>
        </div>
        <span class="logo-text">
          <span class="white-text">Ciné</span><span class="orange-text">Match</span>
        </span>
      </div>
    </header>

    <!-- Main Content Body -->
    <main class="main-body">

      <!-- Titles & Hero Banner -->
      <div class="hero-section">
        <span class="kicker-badge">WELCOME BACK</span>
        <h1 class="hero-title">
          Ready for your next<br />
          <span class="gradient-text">movie match?</span>
        </h1>
        <p class="hero-subtitle">Sign in to find your favorite films and discover matches.</p>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLogin()" class="custom-form">

        <!-- Email Field -->
        <div class="field-group">
          <label class="field-label">Email Address</label>
          <div class="input-box">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="Email"
              required
              class="native-input" />
          </div>
        </div>

        <!-- Password Field with Toggle -->
        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="input-box">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              placeholder="••••••••"
              required
              class="native-input" />
            <button
              type="button"
              class="eye-toggle-btn"
              (click)="toggleShowPassword()"
              [title]="showPassword ? 'Hide password' : 'Show password'">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-wrapper">
          <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="action-btn-pill">
          <span>Sign In</span>
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </button>

      </form>

      <!-- Redirect to Register -->
      <div class="bottom-redirect">
        <p>New to CinéMatch? <a routerLink="/register" class="signup-link">Create an account</a></p>
      </div>

    </main>

  </div>
</ion-content>

<ion-loading [isOpen]="isLoading" message="Signing in..." spinner="crescent"></ion-loading>
<ion-toast [isOpen]="isToastOpen" [message]="toastMessage" [duration]="4000" (didDismiss)="isToastOpen = false" position="top"></ion-toast>
