<ion-content class="admin-users-content" [fullscreen]="true">
  <div class="page-container">

    <!-- Top Navigation Header -->
    <header class="top-nav">
      <div class="nav-logo">
        <div class="logo-orb-small">
          <div class="orb-dot dot-top"></div>
          <div class="orb-heart">
            <ion-icon name="heart"></ion-icon>
          </div>
          <div class="orb-dot dot-left"></div>
          <div class="orb-dot dot-right"></div>
        </div>
        <span class="logo-text">
          <span class="white-text">Ciné</span><span class="orange-text">Match</span>
          <span class="page-name-title">Users</span>
        </span>
      </div>

      <button class="admin-badge-btn" (click)="goTo('/tabs/profile')" type="button" title="View Admin Profile">
        <span>{{ adminInitials }}</span>
      </button>
    </header>

    <!-- Main Content -->
    <main class="main-body">

      <!-- Admin Portal Kicker -->
      <div class="hero-section">
        <span class="kicker-purple">ADMINISTRATION PORTAL</span>
        <h1 class="page-main-heading">User Management</h1>
        <p class="page-subheading">{{ totalUsersCount }} registered community members</p>
      </div>

      <!-- Search Box -->
      <div class="search-box">
        <ion-icon name="search-outline" class="search-icon"></ion-icon>
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (input)="onSearchChange()"
          placeholder="Search by name or email address..."
          class="search-input" />
      </div>

      <!-- Horizontal Filter Pills (All, Active, Deactivated) -->
      <div class="filter-pills-row">
        <button
          type="button"
          class="filter-pill"
          [class.active]="selectedFilter === 'all'"
          (click)="setFilter('all')">
          All ({{ totalUsersCount }})
        </button>

        <button
          type="button"
          class="filter-pill"
          [class.active]="selectedFilter === 'active'"
          (click)="setFilter('active')">
          Active ({{ activeUsersCount }})
        </button>

        <button
          type="button"
          class="filter-pill"
          [class.active]="selectedFilter === 'inactive'"
          (click)="setFilter('inactive')">
          Deactivated ({{ inactiveUsersCount }})
        </button>
      </div>

      <!-- Loading Spinner -->
      <div *ngIf="isLoading" class="state-container ion-text-center">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
        <p>Loading user accounts...</p>
      </div>

      <!-- Empty State -->
      <div *ngIf="!isLoading && filteredUsers.length === 0" class="empty-state ion-text-center">
        <p>No users found matching your query.</p>
      </div>

      <!-- Users Cards List -->
      <div *ngIf="!isLoading && filteredUsers.length > 0" class="users-list">
        <div *ngFor="let user of filteredUsers" class="user-card">

          <!-- Avatar -->
          <div class="user-avatar-wrap">
            <img
              [src]="user.photo || 'https://ionicframework.com/docs/img/demos/avatar.ionic.png'"
              [alt]="user.nom"
              onerror="this.src='https://ionicframework.com/docs/img/demos/avatar.ionic.png'" />
          </div>

          <!-- User Information -->
          <div class="user-info">
            <h3 class="user-name">{{ user.prenom }} {{ user.nom }}</h3>
            <p class="user-email">{{ user.email }}</p>
            <div
              class="status-badge"
              [class.is-active]="user.active !== false"
              [class.is-inactive]="user.active === false">
              <span class="status-dot"></span>
              <span>{{ user.active !== false ? 'Active' : 'Deactivated' }}</span>
            </div>
          </div>

          <!-- Account Activation / Deactivation Toggle -->
          <div class="user-toggle-wrap">
            <ion-toggle
              [checked]="user.active !== false"
              (ionChange)="onToggleActive(user, $event)"
              class="admin-user-toggle"
              title="Toggle account active/deactivated">
            </ion-toggle>
          </div>

        </div>
      </div>

    </main>

  </div>
</ion-content>

<ion-toast [isOpen]="isToastOpen" [message]="toastMessage" [duration]="3000" (didDismiss)="isToastOpen = false"></ion-toast>
