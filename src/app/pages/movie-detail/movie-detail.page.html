<ion-content class="movie-detail-content" [fullscreen]="true">

  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="detail-loading-state ion-text-center">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Loading movie details...</p>
  </div>

  <div class="movie-detail-container" *ngIf="!isLoading && movie">

    <!-- Hero Backdrop Section with Immersive Overlay -->
    <div class="backdrop-hero-section">

      <img
        [src]="movie.posterUrl || 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&q=80'"
        [alt]="movie.title"
        class="backdrop-img"
        (error)="onImgError($event)" />

      <!-- Dark gradient overlay to blend into dark background -->
      <div class="backdrop-gradient-overlay"></div>

      <!-- Top Navigation (Back button) -->
      <div class="hero-top-nav">
        <button class="nav-back-circle-btn" (click)="goBack()" type="button" title="Back">
          <ion-icon name="chevron-back-outline"></ion-icon>
        </button>
      </div>

      <!-- Floating Text Meta at Bottom of Poster -->
      <div class="hero-text-content">
        <span class="director-kicker">CINEMA • {{ (movie.genre || 'FEATURED').toUpperCase() }}</span>
        <h1 class="movie-main-title">{{ movie.title }}</h1>
        <div class="movie-meta-line">
          <span>{{ movie.year }}</span>
          <span class="meta-dot">•</span>
          <span>{{ movie.genre }}</span>
          <span class="meta-dot">•</span>
          <span class="rating-gold">
            <ion-icon name="star"></ion-icon>
            <strong>{{ movie.rating | number:'1.1-1' }}</strong>
          </span>
        </div>
      </div>

    </div>

    <!-- Movie Detail Body Section -->
    <div class="detail-body-section">

      <!-- Synopsis & Runtime Header -->
      <div class="synopsis-header-row">
        <h2 class="synopsis-title">Synopsis</h2>
        <span class="runtime-badge">{{ estimatedRuntime }}</span>
      </div>

      <!-- Overview text -->
      <p class="synopsis-text">
        {{ movie.overview }}
      </p>

      <!-- Tags & Mood Pills -->
      <div class="tags-scroll-row">
        <span *ngFor="let tag of movieTags" class="mood-tag-pill">
          {{ tag }}
        </span>
      </div>

      <!-- Main Action Button: Add to Playlist toggle -->
      <div class="action-btn-wrap">
        <button
          class="playlist-toggle-btn"
          [class.in-playlist]="isFavorite()"
          (click)="toggleFavorite()"
          type="button">
          <ion-icon [name]="isFavorite() ? 'checkmark-outline' : 'heart-outline'"></ion-icon>
          <span>{{ isFavorite() ? 'In My Playlist' : 'Add to My Playlist' }}</span>
        </button>
      </div>

      <!-- Secondary Link: View My Playlist -->
      <div class="view-playlist-link-row" (click)="goToPlaylist()">
        <span>View My Playlist</span>
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </div>

    </div>

  </div>

</ion-content>
